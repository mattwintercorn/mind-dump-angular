<div class="app-container">
  <app-toolbar
    (newIdea)="onNewIdea()"
    (viewModeChange)="onViewModeChange($event)">
  </app-toolbar>

  <main class="app-content">
    <router-outlet />
  </main>
</div>

<!-- Loading overlay for workspaces -->
<app-loading-overlay 
  [isVisible]="authService.isAuthenticated() && workspaceService.isLoading()"
  message="Loading workspaces...">
</app-loading-overlay>
