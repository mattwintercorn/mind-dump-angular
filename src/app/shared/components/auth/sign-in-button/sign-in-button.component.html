<button 
  mat-raised-button 
  color="primary"
  (click)="onSignIn()"
  [disabled]="isLoading()"
  class="sign-in-button">
  
  @if (isLoading()) {
    <mat-spinner diameter="20" class="spinner"></mat-spinner>
  } @else {
    <mat-icon>account_circle</mat-icon>
  }
  
  <span class="button-text">Sign in with GitHub</span>
</button>
