<mat-toolbar color="primary" class="toolbar">
  <span class="toolbar-title">{{ title }}</span>
  
  <span class="spacer"></span>
  
  <button 
    mat-raised-button 
    color="accent" 
    aria-label="New Idea"
    matTooltip="Create a new idea"
    matTooltipPosition="below"
    (click)="onNewIdea()">
    <mat-icon>add</mat-icon>
    New Idea
  </button>
  
  <mat-button-toggle-group 
    [value]="currentViewMode"
    (change)="onViewModeChange($event.value)"
    aria-label="View mode"
    class="view-toggle">
    <mat-button-toggle 
      value="grid" 
      aria-label="Grid view"
      matTooltip="Grid View - Card layout with filters"
      matTooltipPosition="below">
      <mat-icon>grid_view</mat-icon>
    </mat-button-toggle>
    <mat-button-toggle 
      value="graph" 
      aria-label="Graph view"
      matTooltip="Graph View - Force-directed connections"
      matTooltipPosition="below">
      <mat-icon>bubble_chart</mat-icon>
    </mat-button-toggle>
    <mat-button-toggle 
      value="cluster" 
      aria-label="Cluster view"
      matTooltip="Cluster View - Group by keyword/component/project"
      matTooltipPosition="below">
      <mat-icon>hub</mat-icon>
    </mat-button-toggle>
  </mat-button-toggle-group>

  <!-- Sync Status (shown when authenticated) -->
  @if (authService.isAuthenticated()) {
    <app-sync-status></app-sync-status>
  }

  <!-- Auth UI -->
  @if (authService.isAuthenticated()) {
    <!-- User Menu -->
    <button 
      mat-icon-button 
      [matMenuTriggerFor]="userMenu"
      aria-label="User menu"
      class="user-avatar-button">
      @if (authService.currentUser()?.photoURL) {
        <img 
          [src]="authService.currentUser()?.photoURL!" 
          [alt]="authService.currentUser()?.displayName || 'User'"
          class="user-avatar">
      } @else {
        <mat-icon>account_circle</mat-icon>
      }
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="user-menu-header" mat-menu-item disabled>
        <div class="user-info">
          <div class="user-name">{{ authService.currentUser()?.displayName || 'User' }}</div>
          @if (authService.currentUser()?.email) {
            <div class="user-email">{{ authService.currentUser()?.email }}</div>
          }
        </div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="onSignOut()">
        <mat-icon>logout</mat-icon>
        <span>Sign Out</span>
      </button>
    </mat-menu>
  } @else {
    <!-- Sign In Button -->
    <app-sign-in-button></app-sign-in-button>
  }
</mat-toolbar>
